# 2026-09-15 (owner backlog, scraper durability batch): the adapter and
# pipeline tests run on every push and pull request. They are pure-Python
# parsers over fixtures (no network, no database), so the run is seconds.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --quiet -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install --quiet -r requirements-dev.txt; fi
      - name: Run tests
        run: python -m pytest tests -q

<input type="hidden" name="initialHistory" id="initialHistory" value="ftlx0!|!ftlUtil_resetPage!%24!requisitionDescriptionInterface!|!descRequisition!|!rdPager!%24!741819!|!true!|!741819!|!false!|!Submission for the position%5C: Patient Access Team Lead - Admitting %26 Offsite Outpatient - (Job Number%5C: 2603976)!|!false!|!741819!|!false!|!true!|!Patient Access Team Lead - Admitting %26 Offsite Outpatient!|!!*!%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:arial, helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cimg src=%22https%5C://www.stonybrookmedicine.edu/sites/default/files/cckimages/page/medlogo.jpg%22 alt=%22SB Med Logo%22%3E%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3EPosition Summary%3C/strong%3E%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EAt Stony Brook Medicine, our%26nbsp;Patient Access Representatives are responsible for completing varied, diverse and specialized duties to support the Revenue Cycle, Compliance and Patient Experience by accurately and efficiently completing tasks in areas of Registration, Financial Screening and Verification, and patient throughput.%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EQualified candidates will demonstrate excellent communication and interpersonal skills, knowledge and understanding of patient care and effectively respond to changing patient needs by making decisions based on ethical principles and adhering to our high standard of excellence.%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3EThe Patient Access Team Lead, Admitting and Offsite Outpatient Representative %3C/strong%3Eassigned to an offsite hospital outpatient location is a key member of the Patient Access Services Leadership team, responsible for ensuring staff understand and follow training modules and workflows, assists with organizing the daily operations/registrations in absence of Supervisor, courteously greeting and arriving patients for various outpatient encounters while providing the highest level of customer service.%26nbsp;The Team Lead Registrar reviews registrations for completeness, obtains regulatory consents, and ensures financial clearance is complete, collecting POS payments at check in.%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3EDuties of a Patient Access Admitting %26amp; Offsite Outpatient Hospital Team Lead Representative may include the following, but are not limited to%5C:%3C/strong%3E%3C/span%3E%3C/p%3E%3Cul%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EAssumes role of Lead Registrar, and assist organizing the handling of the daily operations/registrations of assigned locations with input and approval from Supervisor and/or Manager, as needed.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EWorks side by side with staff to ensure staff understand and follows training modules and workflows.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EAdvises Supervisor and/or Manager of staff concerns, errors and training needs.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EServes as a Lead superuser coach to staff.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EEfficiently arrives a high volume of appointments for multiple service types in various outpatient or ambulatory settings.%26nbsp;Obtains and secures appropriate documents necessary to support proper patient identification and insurance coverage (i.e. copies of photo ID and insurance cards, etc.).%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EAbility to work collaboratively in a multi-disciplinary environment.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EEnsures that compliance standards are met, including securing general consents and regulatory signatures from patients or designee, essential for treatment and payment. Provisions of patient rights and notices as appropriate. Documents accordingly in registration and EMR system accordingly.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EConducts a thorough data assessment of information documented at pre-registration to ensure all demographic and financial clearance fields are completed and verified to ensure a complete registration and “clean” bill. Verifies proper referrals/authorizations are in place for anticipated services.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EProvides financial guidance and excellence in Financial Care to patients and their representatives by providing information about their health care insurance coverage and cost share responsibilities. Provides self-pay patients with information on qualifications for Medicaid or financial assistance.%26nbsp; Engages financial counselors as appropriate.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3ECollects required POS payments (co-payments, deposits and/or deductibles) at time of arrival.%26nbsp;%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EUtilizing various worklists, monitors and ensures registration workflow and financial clearance process is complete within prescribed time frames.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EDemonstrates a positive organizational attitude and commitment to patient experience. Maintains respectful and compassionate demeanor and provides high-quality patient centered care.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EThe selected candidate will be required to work some holidays and will be scheduled to work every other weekend. The schedule/pass days are subject to change.%3C/span%3E%3C/li%3E%3C/ul%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3EQualifications%3C/strong%3E%3C/span%3E%3C/p%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3ERequired Qualifications%5C:%26nbsp;%3C/strong%3E%3C/span%3E%3C/p%3E%3Cul%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EAssociate%27s Degree with two year working experience in a customer service, public health, healthcare, or related industry such as insurance.%26nbsp; %3Ci%3EOr in lieu of degree,%3C/i%3E four years of demonstrated excellence working in a customer service or call center, healthcare, or other related industry requiring skills which demonstrate experience in payment collection, insurance reimbursement, or access services.%26nbsp;%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EDemonstrated excellence in verbal and written communication, computing and multi-tasking skills.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3ECandidate must demonstrate experience and expertise in speaking with customers and can work well with persons who are under stress (such as sick patients and their distressed family members).%3C/span%3E%3C/li%3E%3C/ul%3E%3Cp style=%22font-family%5C:Arial;%22%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cstrong%3EPreferred Qualifications%5C:%26nbsp;%3C/strong%3E%3C/span%3E%3C/p%3E%3Cul%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EBilingual in English and Spanish.%26nbsp;%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EBilling, Accounts Receivable or Customer Service or Call Center experience.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EFamiliarity with medical insurance benefits, demonstrated through experience with EMR computerized registration, Financial, IT systems.%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EKnowledge of medical terminology.%26nbsp;%3C/span%3E%3C/li%3E%3Cli%3E%3Cspan style=%22font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3EPrevious experience as a patient access representative at a Medical Center is preferred.%3C/span%3E%3C/li%3E%3C/ul%3E%3Cdiv%3E%3Cp style=%22font-family%5C:Arial;line-height%5C:1.38;margin-bottom%5C:0pt;margin-top%5C:0pt;%22 dir=%22ltr%22%3E%26nbsp;%3C/p%3E%3Cp style=%22line-height%5C:1.38;margin-bottom%5C:0pt;margin-top%5C:0pt;%22 dir=%22ltr%22%3E%3Cspan style=%22background-color%5C:transparent;color%5C:rgb(0,0,0);font-family%5C:Arial, Helvetica, sans-serif;font-size%5C:14px;%22%3E%3Cspan style=%22font-style%5C:normal;font-variant%5C:normal;text-decoration%5C:none;vertical-align%5C:baseline;white-space%5C:pre-wrap;%22%3E%3Cstrong%3EPlease Note%5C:%3C/strong%3E%3C/span%3E%3Cspan style=%22font-style%5C:normal;font-variant%5C:normal;font-weigh

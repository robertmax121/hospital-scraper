  "description": "<p><span style=\"text-align:center\"><p><span style=\"text-align:center\">At Oceans Behavioral Hospital Greater New Orleans, healing is our focus. We are passionate about helping adults and seniors manage the challenges associated with anxiety, depression and other mental health issues. Utilizing proven, innovative and progressive therapies, our qualified professionals strive to promote long-term wellness through a range of inpatient and outpatient psychiatric counseling and treatment options.</span></p>\r\n</span></p>\r\n\r\n<p>The Assistant Director of Nursing is responsible for upholding the standards of nursing care as established by the Nurse Practice Act, Psychiatric Standards of Nursing, policy and procedures, and all other external governing and credentialing bodies.&nbsp; The Assistant Director of Nursing directs the staff and operation of the Nursing Department at all facility locations; coordinates, plans and manages nursing activities; formulates nursing program goals and objectives; manages nursing positions; evaluates staff; assists in the management of the nursing budget; maintains contacts with individuals both within and outside of the department who might impact on&nbsp; program activities; participates in recruitment and retention programs; determines the quality of nursing care; participates in performance improvement programs; collaborates with clinical instructors for educational programs; represents the Nursing Department in professional and/or community organizations; demonstrates age specific and cultural sensitivity.&nbsp; All duties to be done in accordance with Joint Commission, Federal and State regulations, Oceans&rsquo; Mission, policies and procedures and Performance Improvement Standards.</p>\r\n\r\n<p>Essential Functions:</p>\r\n\r\n<ol>\r\n\t<li>Utilizes the principles of management/nursing to coordinate patient care and nursing service activities towards positive outcomes; demonstrates fiscal responsibility in scheduling staffing patterns while considering patient safety.</li>\r\n\t<li>Supervises nursing personnel including: determining workload and delegating assignments, training, monitoring and evaluating performance, and initiating corrective or disciplinary actions.&nbsp; Conducts and reviews evaluations on individual staff; makes recommendations for promotion, salary adjustment and/or disciplinary actions.</li>\r\n\t<li>Accountable for nursing performance improvement and contributions to problem identification, investigation and monitoring of resolutions in providing quality care and customer satisfaction.</li>\r\n\t<li>Develops data collection tools, identifies trends, risk areas, and evaluates reliance of research.&nbsp; Coordinates with employees to collect data on the quality of Nursing services; analyzes data collected and submits monthly report to Performance Improvement Director.</li>\r\n\t<li>Oversees and adheres to safety regulations of facility policies and procedures and external regulatory and credentialing bodies; participates as a member of the facility wide safety team.</li>\r\n\t<li>Provides support and acts as a resource for development and implementation of Infection Control, standard precautions policies and procedures.</li>\r\n\t<li>Supports and coordinates patient safety issues in conjunction with Hospital Administrator; analyzes, reviews and follows up on incident reports related to nursing/patient safety issues in conjunction with Risk Management.</li>\r\n\t<li>Ensures staff compliance with patient care, documentation, hospital/unit policies and procedures, protocols, and guidelines; Ensures appropriate nursing staff for each unit to meet patient needs.</li>\r\n\t<li>Directs appropriate training activities for all nursing employees as well as assurance of proper current licensure, continuing education, CPR, and an Oceans Healthcare approved behavioral health de-escalation program; participates in orientation of new and current nursing staff.</li>\r\n\t<li>Performs other duties and projects as assigned</li>\r\n</ol>\r\n",

  "experienceRequirements": "<p>MSN preferred or BSN with management and psychiatric experience with an unrestricted state nursing license. &nbsp;At least 3 years previous experience as an RN.</p>\r\n\r\n<p>Must be flexible with work schedule.&nbsp; Involves discretion and independent action within prescribed limits.&nbsp; This position requires a sound knowledge of nursing practice and leadership abilities with the ability to manage, supervise, and oversee multiple employees.&nbsp; Should demonstrate the ability to solve practical problems and utilize appropriate steps for problem resolution, ability to interpret a variety of instructions furnished in written, oral, diagram, or schedule form, and ability to exercise sound judgment.&nbsp; Must be competent in the areas of interpersonal communications, excellent verbal and written skills, knowledge of Medicare and regulatory and credentialing criteria standards, knowledge of safety standards, spread of organisms, and the adult learning process.&nbsp; Must be competent in the provision of nursing care.&nbsp; Must successfully complete CPR certification and an Oceans approved behavioral health de-escalation program.</p>\r\n\r\n<p>Subject to many interruptions.&nbsp; Occasional pressure due to multiple calls and inquiries.&nbsp; This position can be high paced and stressful; must be able to cope mentally and physically to atmosphere.&nbsp; Work requires spending approximately 90% or more of the time inside a building that offers protection from weather conditions but not necessarily from temperature changes.</p>\r\n"

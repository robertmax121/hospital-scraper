<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-10-08","description":"<p class='MsoNormal' style='text-align: center;'><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Respiratory Therapist&nbsp;</strong></p> <p class='MsoNormal'>&nbsp;</p> <p class='MsoNormal' style='text-align: center;'><strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; USPI Arizona Specialty Hospital is Hiring a Respiratory Therapist PRN!</strong></p> <p>&nbsp;</p> <p class='MsoNormal'>USPI Arizona Specialty Hospital is a specialty inpatient hospital which was established to set a new standard for excellence and patient satisfaction in the delivery of orthopedic and spinal surgery. Arizona Specialty Hospital provides excellent patient services and the highest level of care, with the overall goal of improving the delivery of healthcare in Maricopa County and beyond.</p> <p class='MsoNormal'>Our singular focus is the state-of-the-art care of musculoskeletal conditions including joint replacement, spine surgery and other reconstructive procedures. Our mission is to provide first-class surgical services for the community in a safe, comfortable and welcoming environment; one in which we would be happy to treat our own families.</p> <p>This position provides Respiratory care services that are covered under the employee&rsquo;s license to practice respiratory care.</p> <p>&nbsp;</p> <p><strong>RESPONSIBILITIES:</strong></p> <ul> <li>Display polite, friendly, efficient and responsive attitude to patients, patient families, co-workers and customers.</li> <li>Administration of oxygen</li> <li>Equipment storage, assembly, disassembly, and maintenance</li> <li>Gas cylinder transport.</li> <li>Administration of hand held nebulizer treatments</li> <li>Instruction of incentive spirometers.</li> <li>Instruction of metered dose inhalers.</li> <li>Sputum inductions.</li> <li>Performs Blood gases</li> <li>Ventilator application and maintenance (only with direction of MD)</li> <li>Administers EKGs.</li> <li>Adhere to established systems and training programs to provide a safe working environment. Complies with all OSHA regulations and other local, state and federal regulations.</li> <li>Recognize and adopts activities appropriate to the specific needs of the patient population and demonstrates knowledge of specific issues directly related to age of patient population.</li> <li>Maintains compliance with all requirements of Federal, State and local regulations and guidelines including the Civil Rights Act of 1964, as amended, the Age Discrimination in Employment Act of 1967, as amended, and the Americans with Disabilities Act, as amended.</li> <li>Perform all other related duties.</li> </ul> <p>&nbsp;</p> <p><strong>Who We Are</strong></p> <p><br>At USPI, we create relationships that create better care. We partner with physicians and healthcare systems to provide first-class ambulatory solutions throughout the United States. We are committed to providing surgical services in the most efficient and clinically excellent manner.</p> <p>USPI is committed to, and proud of our inclusive culture. An inclusive culture, in our view, is respectful of differences and nurtures and supports the contributions of each individual, while also embracing and leveraging diversity. A diverse workforce, combined with an inclusive culture, makes USPI stronger and better able to meet the needs of our diverse patient and physician population.</p><br><b>Required Skills:</b><br><p>Qualifications</p> <p class='MsoBodyText3' style='margin-left: .5in; text-align: left; text-indent: -.25in; mso-list: l0 level1 lfo1; tab-stops: list .5in;' align='left'><!-- [if !supportLists]--><span style='font-size: 11.0pt; font-family: Symbol; mso-fareast-font-family: Symbol; mso-bidi-font-family: Symbol;'><span style='mso-list: Ignore;'>&middot;<span style='font: 7.0pt 'Times New Roman';'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span></span><!--[endif]--><span style='font-size: 11.0pt;'>Graduate of a 1 year AMA approved Respiratory Care program.</span></p> <p class='MsoBodyText3' style='margin-left: .5in; text-align: left; text-indent: -.25in; mso-list: l0 level1 lfo1; tab-stops: list .5in;' align='left'><!-- [if !supportLists]--><span style='font-size: 11.0pt; font-family: Symbol; mso-fareast-font-family: Symbol; mso-bidi-font-family: Symbol;'><span style='mso-list: Ignore;'>&middot;<span style='font: 7.0pt 'Times New Roman';'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span></span><!--[endif]--><span style='font-size: 11.0pt;'>Licensed Arizona Respiratory Care Practitioner (RCP). Preferably 1+ years of clinical experience.</span></p> <p class='MsoBodyText3' style='margin-left: .5in; text-align: left; text-indent: -.25in; mso-list: l0 level1 lfo1; tab-stops: list .5in;' align='left'><!-- [if !supportLists]--><span style='font-size: 11.0pt; font-family: Symbol; mso-fareast-font-family: Symbol; mso-bidi-font-family: Symbol;'><span style='mso-list: Ignore;'>&middot;<span style='font: 7.0pt 'Times New Roman';'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span></span><!--[endif]--><span style='font-size: 11.0pt;'>Preferred field of expertise in RRT.</span></p> <p class='MsoBodyText3' style='margin-left: .5in; text-align: left; text-indent: -.25in; mso-list: l0 level1 lfo1; tab-stops: list .5in;' align='left'><!-- [if !supportLists]--><span style='font-size: 11.0pt; font-family: Symbol; mso-fareast-font-family: Symbol; mso-bidi-font-family: Symbol;'><span style='mso-list: Ignore;'>&middot;<span style='font: 7.0pt 'Times New Roman';'>&nbsp;&nbsp;&nbsp;&nbsp;&n

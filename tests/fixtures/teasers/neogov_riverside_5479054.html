        "title" : "Registered Nurse II/III - MC/CHC - Nurse Support Teams - Wound Care Team",
        "description" : "&lt;div style=&quot;text-align: center;&quot;&gt;&lt;span style=&quot;color: rgb(0, 82, 51);&quot;&gt;&lt;img src=&quot;https://secure.neogov.com/images/AgencyImages/jobposting/9/jobpostings/image/20260401113003_RUHS Medical Center 3.png&quot; data-uw-rm-alt=&quot;QU&quot; data-id=&quot;null&quot; data-name=&quot;20260401113003_RUHS Medical Center 3.png&quot; alt=&quot;20260401113003_RUHS Medical Center 3.png&quot; data-url=&quot;https://secure.neogov.com/images/AgencyImages/jobposting/9/jobpostings/image/20260401113003_RUHS Medical Center 3.png&quot; style=&quot;width: 300px;&quot; class=&quot;fr-fic fr-dii&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/div&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;br&gt;The County of Riverside&#39;s Riverside University Health System is seeking an experienced Registered Nurse to work in the Nurse Support Teams Unit, (Wound Care Team). The essential duties of this position includes, but are not limited to, collaborating closely with nursing, providers, Case Management, and other interdisciplinary teams, providing specialized inpatient wound, ostomy, and continence care, including wound and pressure injury assessment, pressure injury staging and prevention, treatment recommendations, negative pressure wound therapy/wound VAC management, ostomy care and education, wound photography and measurements, documentation, patient/family education, pressure injury follow-up and rounding, and discharge coordination.&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;p style=&quot;margin-top:0in;margin-right:0in;margin-bottom:0in;margin-left:0in;&quot; data-pasted=&quot;true&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;This is a specialized inpatient position within our Wound &amp;amp; Ostomy Program. The Registered Nurse will work across multiple inpatient areas and must be able to independently prioritize and manage a high-volume consult workload, complex wounds, wound VACs, pressure injury follow-up, and discharge needs. The position also supports our pressure injury prevention and quality initiatives and Joint Commission Wound Care Disease-Specific Certification.&lt;/span&gt;&lt;/p&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;br&gt;The ideal candidate will possess acute care and wound care experience as a Registered Nurse. &amp;nbsp;Additionally, experience with pressure injury assessment/staging, complex wounds, wound VAC/NPWT therapy, ostomy care, and patient education is highly preferred. &amp;nbsp; A Bachelor&#39;s Degree in Nursing and National Wound/Ostomy Certification is also highly preferred.&lt;br&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(0, 82, 51);&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;u&gt;Required Licenses &amp;amp; Certifications&lt;/u&gt;&lt;br&gt;&lt;/span&gt;&lt;ul&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Current and valid license to practice as a Registered Nurse in the State of California.&lt;/li&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Current and valid Basic Life Support, (BLS), certification issued by the American Heart Association.&lt;/li&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Wound and/or ostomy certification (CWON, CWOCN, WCC, or equivalent) preferred, (must have completed within 1 year of hire).&lt;/li&gt;&lt;/ul&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;br&gt;&lt;u&gt;Additional Information&lt;/u&gt;&lt;/span&gt;&lt;ul style=&quot;margin-bottom: 3pt;&quot;&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Schedule: 4/10, 8:30 a.m.–7:00 p.m.&lt;/li&gt;&lt;/ul&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;&lt;u&gt;Salary Range (Hourly) &amp;amp; Differentials&lt;/u&gt;&lt;/span&gt;&lt;ul&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Registered Nurse II - MC/CHC - $45.7530 - $70.8141&lt;/li&gt;&lt;li style=&quot;color: rgb(0, 0, 0);&quot;&gt;Registered Nurse III - MC/CHC - $53.1735 - $80.2448&lt;/li&gt;&lt;li data-pasted=&quot;true&quot; style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;span style=&quot;font-style: normal; text-align: left; text-indent: 0px;&quot;&gt;Critical Care Pay: $4.00/hour.&lt;/span&gt;&lt;ul style=&quot;padding-left: 2rem; margin-top: 0px; margin-bottom: 3pt; font-weight: initial; color: initial;&quot;&gt;&lt;li style=&quot;color: rgb(0, 0, 0); font-weight: bold;&quot;&gt;&lt;p style=&quot; margin: 0pt 0in;&quot;&gt;&lt;strong&gt;Specialty Care/Critical Care differentials will be applied following completion of required specialty training, attainment of all necessary certifications, and departmental determination that the employee is authorized to work independently.&lt;/strong&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;u&gt;Meet the Team!&lt;/u&gt;&lt;/span&gt;&lt;p style=&quot;font-style: normal; margin: 0in 0in 8pt; color: inherit; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;At Riverside University Health System Medical Center, nursing is more than a job, it’s an opportunity to make a real difference in a vibrant and diverse community. Nationally recognized for its forward-thinking and innovative approach to patient care, RUHS Medical Center is also a proud teaching hospital and one of the top employers in the region.&lt;/span&gt;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 0in 0in 8pt; color: inherit; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;Our 439-bed facility is a designated Level I Trauma Center, Primary Stroke Center, and home to the region’s only Pediatric Intensive Care Unit (PICU). Here, you’ll gain valuable experience across a wide range of specialties, including trauma care, stroke, pediatrics, and critical care.&lt;/span&gt;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 0in 0in 8pt; color: inherit; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;We are committed to your professional growth, offering continuous education, training, and career development programs in a collaborative, supportive, and rewarding environment. Whether you’re an experienced nurse or just starting your career, RUHS Medical Center provides unparalleled opportunities to learn, grow, and make a meaningful impact.&lt;/span&gt;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 0in 0in 8pt; color: inherit; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;Could you see yourself making a difference here? &amp;nbsp;Discover more about RUHS Medical Center at &lt;a href=&quot;http://www.ruhealth.org/&quot; data-uw-rm-brl=&quot;PR&quot; data-uw-original-href=&quot;http://www.ruhealth.org&quot; style=&quot;color: rgb(0, 0, 0);&quot;&gt;www.ruhealth.org&lt;/a&gt;.&lt;/span&gt;&lt;/p&gt;&lt;br&gt;&lt;div style=&quot;text-align: center;&quot;&gt;&lt;a href=&quot;https://issuu.com/rivcohr/docs/hr_flipbook_1-24-23_r3&quot; data-uw-rm-brl=&quot;PR&quot; data-uw-original-href=&quot;https://issuu.com/rivcohr/docs/hr_flipbook_1-24-23_r3&quot; data-uw-rm-empty-ctrl=&quot;&quot;&gt;&lt;img src=&quot;https://rc-hr.com/files/2023-08/Banner%20Update%202.jpg&quot; class=&quot;fr-fic fr-dii&quot; data-uw-rm-alt-original=&quot;&quot; data-uw-rm-alt=&quot;QU&quot; style=&quot;width: 696px;&quot;&gt;&lt;/a&gt;&lt;/div&gt;&lt;br&gt;&lt;dl style=&quot;margin: 0px; color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot; data-pasted=&quot;true&quot;&gt;&lt;dt style=&quot;margin-bottom: 5px; color:inherit; font-weight: bold;&quot;&gt;Examples of Essential Duties (may include but not limited to)&lt;/dt&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Assess, plan, organize, and provide nursing care to assigned patients in accordance with physician instructions; make preliminary observations of patients and prepare patients for medical treatment.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Assist physicians in administering treatments and in performing medical examinations, diagnostic tests and surgical operations.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Administer prescribed treatment and medications, including dispensing, as ordered to patients; chart treatment of patients; record and report significant changes in condition and general progress of patients.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Counsel and advise patients, families and significant others regarding special medical problems and/or proper healthcare methods.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Prepare and maintain concise and complete records and reports; instruct patients in carrying out physician&#39;s orders; transcribe physician&#39;s orders to working records.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Provide orientation and training to new staff, residents, medical students, Regional Occupational Program (ROP) participants and nursing students.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Participate in quality assurance reviews; act as a team leader or relief charge nurse.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Assign and monitor, the work of subordinate nursing personnel; participate in committee activities; identify staff training needs.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Triage patients by reviewing admission charts and merging patients into the appropriate patient assignment or clinic flow when appropriate.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Testify in court as to client&#39;s mental and physical condition.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Coordinate and monitor patients through the hospitalization process utilizing physicians, primary care nurses and third-party payors to maintain quality care and fiscal responsibility.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;• Review the post hospital care plan with the patient,/family establishing a contact regarding timeframes and responsibilities; follow care plan through patient discharge.&lt;/p&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;strong style=&quot;color: inherit;font-style: normal;text-indent: 0.0px;&quot;&gt;&lt;u&gt;Registered Nurse II - MC/CHC&lt;/u&gt;&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;span style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;strong&gt;Education:&lt;/strong&gt; Successful completion of the education required to obtain a valid license to practice as a Registered Nurse in the State of California. (A bachelor&#39;s degree from an accredited college or university in nursing or a health-related field may be required for some positions.)&lt;/span&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;strong&gt;Experience&lt;/strong&gt;: Equivalent to one year of full-time experience as a Registered Nurse in an acute care hospital, clinic outpatient setting, or healthcare agency program. &amp;nbsp;Experience gained as an Interim Permit Nurse may be credited toward meeting the required experience. Evaluations and references must show proficiency of practice as a Registered Nurse.&lt;/span&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;span style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;strong&gt;Knowledge of: &lt;/strong&gt;Current principles, techniques and procedures used in professional nursing; medical terminology and patient care routine appropriate to clinical setting; medical instruments and equipment; the uses and effects of medicines and narcotics; community resources available to provide patient care and follow-up; federal, state and local laws and regulations governing professional aspects of nursing; identification of potential discharge needs; payor source documentation requirements and governmental regulations affecting reimbursement.&lt;/span&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;strong&gt;&lt;br style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;/strong&gt;&lt;span style=&quot;color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot;&gt;&lt;strong&gt;Ability to:&lt;/strong&gt; Perform the full range of nursing duties and responsibilities in a patient care setting; plan and organize nursing plans for patients; prepare and maintain concise and complete records and reports; establish and maintain effective working relationships with physicians, patients, and fellow employees; assist in the instruction of entry-level nurses and ancillary personnel; evaluate the medical records of hospital admissions; make recommendations regarding continued stay necessity; identify discharge needs.&lt;/span&gt;&lt;br&gt;&lt;br&gt;&lt;strong style=&quot;color: inherit;font-style: normal;text-indent: 0.0px;&quot;&gt;&lt;u&gt;Registered Nurse &amp;nbsp;III - MC/CHC&lt;/u&gt;&amp;nbsp;&lt;br style=&quot;color: inherit;font-style: normal;text-indent: 0.0px;&quot;&gt;&lt;/strong&gt;&lt;dl style=&quot;margin: 0px; color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot; data-pasted=&quot;true&quot;&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;dl style=&quot;margin: 0px; color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot; data-pasted=&quot;true&quot;&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;&lt;strong&gt;Education:&lt;/strong&gt; Successful completion of the education required to obtain a valid license to practice as a Registered Nurse in the State of California. (A bachelor&#39;s degree from an accredited college or university in nursing or a health-related field may be required for some positions.)&amp;nbsp;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;&lt;strong&gt;Experience: &lt;/strong&gt;Equivalent to three years of full time experience as a Registered Nurse in an acute care facility or community health agency with references and evaluations to show appropriate skill level. (A bachelor&#39;s degree from an accredited college or university in nursing or a national certification in a nursing specialty may be substituted for one year of the required experience. &amp;nbsp;A master&#39;s degree from an accredited college or university in nursing may be substituted for two years of the required experience.) &amp;nbsp;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;&lt;strong&gt;Knowledge of: &lt;/strong&gt;Current principles, techniques and procedures used in professional nursing; medical terminology and patient care routine appropriate to clinical setting; medical instruments and equipment; the uses and effects of medicines and narcotics; community resources available to provide patient care and follow-up; federal, state and local laws and regulations governing professional aspects of nursing; identification of potential discharge needs; payor source documentation requirements and governmental regulations affecting reimbursement.&amp;nbsp;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;&lt;strong&gt;Ability to:&lt;/strong&gt; Perform the full range of nursing duties and responsibilities in a patient care setting; plan and organize nursing plans for patients; prepare and maintain concise and complete records and reports; establish and maintain effective working relationships with physicians, patients and fellow employees; secure the cooperation of employees to work effectively together; assist in the instruction of entry-level nurses and ancillary personnel; keep abreast of developments in area of nursing specialization; evaluate the medical records of hospital admissions; make recommendations regarding continued stay necessity; identify discharge needs.&lt;/p&gt;&lt;/dd&gt;&lt;dt style=&quot;margin-bottom: 5px; color:inherit; font-weight: bold;&quot;&gt;Other Requirements&lt;/dt&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;License/Certificate: Must possess and maintain a current valid license to practice as a Registered Nurse in the State of California.&amp;nbsp;&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;Possession and maintenance of a current valid Basic Life Support (BLS) certificate issued by the American Heart Association.&lt;/p&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;Possession of a valid California Driver&#39;s License may be required.&lt;/p&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;strong&gt;&lt;br style=&quot;color: inherit;font-style: normal;text-indent: 0.0px;&quot;&gt;&lt;/strong&gt;&lt;dl style=&quot;margin: 0px; color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot; data-pasted=&quot;true&quot;&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;dl style=&quot;margin: 0px; color: inherit; font-style: normal; text-align: start; text-indent: 0px;&quot; data-pasted=&quot;true&quot;&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;p style=&quot;font-style: normal; margin: 10px 0px;&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;/dd&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;br&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/dd&gt;&lt;dd style=&quot;margin-left: 0px; margin-bottom: 20px; font-style: normal !important;&quot;&gt;&lt;br&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;br&gt;&lt;br style=&quot;color: inherit;font-style: normal;text-indent: 0.0px;&quot;&gt;&lt;br&gt;&lt;div style=&quot;text-align: left;&quot; data-pasted=&quot;true&quot;&gt;&lt;strong&gt;Application Status&lt;/strong&gt;&lt;br data-pasted=&quot;true&quot;&gt;How to confirm your application was received or check on the status of your application, log-in to&amp;nbsp;&lt;a href=&quot;//www.GovernmentJobs.com&quot; data-uw-rm-brl=&quot;PR&quot; data-uw-original-href=&quot;//www.GovernmentJobs.com&quot;&gt;www.GovernmentJobs.com&lt;/a&gt;, click on your name in the upper right corner, and click on “Applications &amp;amp; Status.”&lt;br&gt;&amp;nbsp;&lt;br&gt;&lt;strong&gt;Sign Up for Job Alerts&lt;/strong&gt;&lt;br&gt;Go to&amp;nbsp;&lt;a href=&quot;//www.RC-HR.com&quot; data-uw-rm-brl=&quot;PR&quot; data-uw-original-href=&quot;//www.RC-HR.com&quot;&gt;www.RC-HR.com&lt;/a&gt;, click on “Careers,” click on “County Job Openings,” and click on “Subscribe to Job Alerts” icon.&amp;nbsp;&lt;br&gt;&amp;nbsp;&lt;br&gt;&lt;strong&gt;For questions regarding this recruitment:&lt;/strong&gt;&lt;br&gt;Contact Jasmine Watts at (951) 955-2769 or&amp;nbsp;&lt;a href=&quot;mailto:jwatts@rivco.org&quot;&gt;jwatts@rivco.org&lt;/

<script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Centinela Hospital Medical Center","sameAs":"UNAVAILABLE"},"validThrough":"2027-09-03T04:00:00.000Z","jobLocation":[{"address":{"addressCountry":"US","streetAddress":"555 East Hardy Street","@type":"PostalAddress","postalCode":"90301","addressLocality":"Inglewood","addressRegion":"CA","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"CONTRACTOR","@type":"JobPosting","description":"<h2>Overview<\/h2>\n<p>At Centinela Hospital Medical Center, our dedicated team of professionals are committed to our core values of quality, compassion, and community. As a member of Prime Healthcare, a Top-15 hospital system in the United States, Centinela Hospital Medical Center is actively seeking new members to join its award-winning team!<\/p>\n<p>&nbsp;<\/p>\n<p>Centinela Hospital Medical Center has been serving the communities of Inglewood and the wider Los Angeles area for 100 years. An award-winning facility, ranking in the top 5% nationally for quality and patient safety, Centinela Hospital is a 362-bed acute-care hospital with a 24-hour STEMI certified emergency department and primary stroke center, orthopedic care, advanced cardiac services, critical care services, inpatient and outpatient rehab programs, and more. Centinela has earned hundreds of national awards and recognitions, including \"100 Top Hospital\" recognition from Fortune/Merative and straight 'A's (2018-2024) for hospital safety from The Leapfrog Group.&nbsp;For more information, visit www.centinelamed.com.<\/p>\n<p>&nbsp;<\/p>\n<h2>Responsibilities<\/h2>\n<p>To provide emotional support, crisis intervention and counseling for Pediatrics, Adolescents, Adults, Older Adults and their significant others to cope with a multiplicity of social and emotional problems; information and referral; referrals for financial assistance and supportive services to patients and families with problems that are related to hospitalization, illness, disability or trauma. To provide case management &amp; milieu management, complete psychosocial assessments, assist in the development and re-evaluation of Treatment Plans and work as a member of a multidisciplinary team, and to coordinate discharge planning. Complete necessary documentation and maintain clinical record for each client during his/her length of stay.<\/p>\n<h2>Qualifications<\/h2>\n<p><strong>EDUCATION, EXPERIENCE, TRAINING<\/strong><\/p>\n<p><strong>Required qualifications:<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>1. Master\u2019s Degree in Social Work related field OR2. Master\u2019s Degree in Marriage and Family Therapy or related field.3. In states without required licensure, then current registration with State Board is required within 3 months of hire. In states with required licensure, license required at time of hire and must be maintained.4. Minimum one (1) year hospital or Outpatient experience with emphasis in mental health care.5. Experience in working with a diverse population with a wide range of problems (i.e., death and dying, maternal and child care, substance abuse, disability, chronic illness, etc.).<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Preferred qualifications:<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>1. Current BCLS certificate upon hire and maintain current preferred.<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<h2>Pay Transparency<\/h2>\n<p>Centinela Hospital Medical Center offers competitive compensation and a comprehensive benefits package that provides employees the flexibility to tailor benefits according to their individual needs. Our Total Rewards package includes, but is not limited to, paid time off, a 401K retirement plan, medical, dental, and vision coverage, tuition reimbursement, and many more voluntary benefit options. A reasonable compensation estimate for this role, which includes estimated wages, benefits, and other forms of compensation, is $28.00 to $43.62. The exact starting compensation to be offered will be determined at the time of selecting an applicant for hire, in which a wide range of factors will be considered, including but not limited to, skillset, years of applicable experience, education, credentials and licensure.<\/p>\n<h2>Employment Status<\/h2>Per Diem\n<h2>Shift<\/h2>Days\n<h2>Equal Employment Opportunity<\/h2>\n<p>Company is an equal employment opportunity employer. Company prohibits discrimination against any applicant or employee based on race, color, sex, sexual orientation, gender identity, religion, national origin, age (subject to applicable law), disability, military status, genetic information or any other basis protected by applicable federal, state, or local laws. The Company also prohibits harassment of applicants or employees based on any of these protected categories. Know Your Rights:&nbsp;<u>https://www.eeoc.gov/sites/default/files/2022-10/EEOC_KnowYourRights_screen_reader_10_20.pdf<\/u><\/p>&nbsp;\n<h2>Privacy Notice<\/h2>\n<p><em>Privacy Notice for California Applicants:&nbsp;<\/em>https://www.primehealthcare.com/wp-content/uploads/2024/04/Notice-at-Collection-and-Privacy-Policy-for-California-Job-Applicants.pdf<\/p>\n<p>&nbsp;<\/p>","directApply":true,"datePosted":"2026-09-03T04:00:00.000Z","title":"Social Worker II","occupationalCategory":"Clinical Professional","@context":"http://schema.org","url":"https://careers-primehealthcare.icims.com/jobs/278990/social-worker-ii/job"}</script>

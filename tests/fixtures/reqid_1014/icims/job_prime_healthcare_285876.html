ns<\/h2>\n<p>EDUCATION, EXPERIENCE, TRAINING<\/p>\n<p>&nbsp;<\/p>\n<p>1. Bachelor\u2019s degree in Human Resources, or closely related field required. 2. PHR, SPHR or relevant Human Resources certifications or advanced degree, preferred.3. 5 years\u2019 experience in Human Resources required, with focus on employee relations and/or labor relations experience preferred.4. Strong knowledge of labor laws, regulations, and collective bargaining processes. 5. Proven experience in employee relations, conflict resolution, and negotiation skills. 6. Demonstrated ability to work efficiently under conditions of multiple deadlines and changing priorities to produce a large volume of material with attention to detail.7. Computer knowledge that includes Excel, Word, Outlook.<\/p>\n<h2>Pay Transparency<\/h2>\n<p>Olympia Fields Hospital offers competitive compensation and a comprehensive benefits package that provides employees the flexibility to tailor benefits according to their individual needs. Our Total Rewards package includes, but is not limited to, paid time off, a 401K retirement plan, medical, dental, and vision coverage, tuition reimbursement, and many more voluntary benefit options. A reasonable compensation estimate for this role, which includes estimated wages, benefits, and other forms of compensation, is $72,800.00 to $101,649.60 on an annualized basis. The exact starting compensation to be offered will be determined at the time of selecting an applicant for hire, in which a wide range of factors will be considered, including but not limited to, skillset, years of applicable experience, education, credentials and licensure.<\/p>\n<p>&nbsp;<\/p>\n<p>The company is dedicated to empowering its staff with a comprehensive, competitive benefits package, allowing them the freedom to customize their benefits to fit their unique needs. Our abundant resources, programs, and voluntary options serve as a foundation for individual growth and well-being. Learn more here: https:/

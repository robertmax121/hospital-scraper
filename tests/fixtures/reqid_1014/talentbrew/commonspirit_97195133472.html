<script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "title": "Surgical Tech", "identifier": {"@type": "PropertyValue", "name": "Job ID", "value": "2026-480318"}, "datePosted": "2026-08-03", "employmentType": "Full Time", "description": "<br><span class='desc-responsibilities'><b>Job Summary and Responsibilities</b></span><br><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>As our Surgical Tech, you will help prepare the operating room and surgical team so they can successfully perform a variety of surgical procedures for patients.</span></p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Every day you will set up surgical equipment and instruments, assist the surgical team, and ensure a sterile environment. You will be expected to adapt quickly, collaborate effectively within the OR team, and contribute directly to the patient's healing process.</span></p><p style='margin-top: 0pt; margin-bottom: 0pt;'>&nbsp;</p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>To be successful in this role, you must possess adaptability, a strong team-player mindset, and enthusiasm for supporting complex surgical procedures.</span></p><ul style='margin-top: 0; margin-bottom: 0;'><li style='font-size: 11pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;' aria-level='1'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Prepare and sterilize all surgical supplies, instruments, solutions, and medications.</span></li><li style='font-size: 11pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;' aria-level='1'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Meticulously organize sterile tables and anticipate surgical team needs.</span></li><li style='font-size: 11pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;' aria-level='1'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Perform accurate counts, manage specimens, and uphold the highest sterile technique.</span></li><li style='font-size: 11pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;' aria-level='1'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Ensure a safe environment, report issues, and assist with OR turnaround.</span></li><li style='font-size: 11pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;' aria-level='1'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Provide essential on-call support with a 30-minute response time.</span></li></ul><p style='margin: 0px;'>&nbsp;</p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>We are offering a $9,000 Sign-on Bonus and up to $7,000 in Education Assistance</span></p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>*ask a Recruiter for details*</span></p><span class='desc-qualification'><b>Job Requirements</b></span><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Completion of an accredited Surgical Technology program</span></p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sans-serif; color: #000000; font-weight: 400;'>Certification in Surgical Technology preferred</span></p><p style='margin-top: 0pt; margin-bottom: 0pt;'><span style='font-size: 12pt; font-family: Arial,sa

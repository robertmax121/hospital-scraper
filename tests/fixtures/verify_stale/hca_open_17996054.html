                        "description" : "<p><b><\/b> <\/p> Hourly Wage Estimate: 40.35 - 58.87 / hour<br>Learn more about the <a href=\"https://careers.hcahealthcare.com/pages/employee-benefits-and-rewards\">benefits offered<\/a> for this job.<br><br> <p>The estimate displayed represents the typical wage range of candidates hired. Factors that may be used to determine your actual salary may include your specific skills, how many years of experience you have and comparison to other employees already in this role. The typical candidate is hired below midpoint of the range.<\/p><p><span lang=\"EN-US\" class=\"TextRun SCXW232182289 BCX0\" style=\"font-weight:normal\"><span class=\"NormalTextRun SCXW232182289 BCX0\">As the nation’s largest private employer of Registered Nurses,&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">we’re&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">honored by the trust of over 100,000 nurses and committed to supporting safe, high-quality care for which they can practice.&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">That’s&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">why more than 80% of our hospitals earn an A or B Leapfrog safety grade, rank in the top 5% nationally for patient outcomes through&nbsp;<\/span><span class=\"NormalTextRun SpellingErrorV2Themed SCXW232182289 BCX0\">Health Grades<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">, or&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">are recognized as Magnet or Pathway to Excellence facilities. Join&nbsp;<\/span><span class=\"NormalTextRun SCXW232182289 BCX0\">us!<\/span><\/span>&nbsp;&nbsp;<\/p><h5>Job Summary and Qualifications<\/h5><p><\/p><p><span class=\"NormalTextRun SCXW225449087 BCX8\">Under the general supervision of the unit’s director or&nbsp;<\/span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW225449087 BCX8\">designee<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;the CNC assumes responsibility for direction and coordination of all functions in the unit on his/her designated shifts. In collaboration with other members of the management team, this individual&nbsp;<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">is responsible for<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;the ongoing assessment of the quality of patient care services provided in&nbsp;<\/span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW225449087 BCX8\">unit<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">.&nbsp;<\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/p><p>The Clinical Nurse Coordinator is an RN who demonstrates the knowledge and skills necessary to provide care for his/her patients. Each unit may require specialized skills. The delivery of care is based on criteria that is age appropriate and is based on the physical, psychosocial, cultural, safety and learning needs of the individual patient. The Clinical Nurse Coordinator, may rotate to other areas other than his/her normally assigned service area/s, and will perform those duties for which he/she has demonstrated competency. The Clinical Nurse Coordinator performs delegated duties consistent with his/her scope of practice and functions within the philosophy and overall plan of care delivery. The Clinical Nurse Coordinator displays positive support as well as the entire HealthONE organization. The Clinical Nurse Coordinator cares for patients from Adolescents to geriatrics.<\/p><h6><div class=\"OutlineElement Ltr SCXW225449087 BCX8\" style=\"font-size:12px;font-weight:400\"><p class=\"Paragraph SCXW225449087 BCX8\"><\/p><\/div><div class=\"OutlineElement Ltr SCXW225449087 BCX8\" style=\"font-size:12px\"><p class=\"Paragraph SCXW225449087 BCX8\"><b><span lang=\"EN-US\" class=\"TextRun SCXW225449087 BCX8\"><span class=\"NormalTextRun SCXW225449087 BCX8\">The CNC:<\/span><\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/b><\/p><p class=\"Paragraph SCXW225449087 BCX8\" style=\"font-weight:400\"><\/p><ul style=\"font-weight:400\"><li><span lang=\"EN-US\" class=\"TextRun SCXW225449087 BCX8\"><span class=\"NormalTextRun SCXW225449087 BCX8\">Assumes responsibility for direction and coordination of all functions during the designated shift.<\/span><\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/li><li><span class=\"NormalTextRun SCXW225449087 BCX8\">Functions as a resource person for staff&nbsp;<\/span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW225449087 BCX8\">member<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;and&nbsp;<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">assists<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;in&nbsp;<\/span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW225449087 BCX8\">necessary<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;education of individual members of the nursing staff.<\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/li><li><span class=\"NormalTextRun SCXW225449087 BCX8\">Assumes responsibility for the overall quality of nursing care provided when s/he is on duty<\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/li><li><span class=\"NormalTextRun SCXW225449087 BCX8\">Makes decisions&nbsp;<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">regarding<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;activities with these areas based on Administrative Operational Standards, Nursing Administrative Standards, Human Resource Standards, and Standards of Care for the unit, in collaboration with other members of the management team.<\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><span class=\"NormalTextRun SCXW225449087 BCX8\">&nbsp;<\/span><span class=\"EOP Selected SCXW225449087 BCX8\">&nbsp;<\/span><\/li><\/ul><p><b>Qualifications:&nbsp;<\/b><\/p><p><\/p><ul><li>Current licensure in the State of Colorado as a Registered Nurse, or current active multistate Registered Nurse license.<\/li><li>Current AHA or ARC BLS required.<\/li><li>AHA or ARC ACLS preferred.<\/li><li>Graduate of an Accredited School of Nursing; BSN desirable.<\/li><li>Two to four years acute care/specialty nursing is desirable. 1 to 3 years previous experience in charge/supervisory position desirable; able to articulate and demonstrate knowledge of nursing theory and practice.<\/li><\/ul><p class=\"Paragraph SCXW225449087 BCX8\" style=\"font-weight:400\"><\/p><p class=\"Paragraph SCXW225449087 BCX8\" style=\"font-weight:400\"><\/p><p class=\"Paragraph SCXW225449087 BCX8\" style=\"font-weight:400\"><\/p><\/div><div class=\"OutlineElement Ltr SCXW225449087 BCX8\" style=\"font-size:12px;font-weight:400\"><p class=\"Paragraph SCXW225449087 BCX8\"><\/p><p class=\"Paragraph SCXW225449087 BCX8\"><\/p><\/div><\/h6><p><\/p><p> <\/p><p><\/p><h5>Benefits<\/h5><p>HCA HealthONE Mountain Ridge, offers a total rewards package that supports the health, life, career and retirement of our colleagues. The available plans and programs include:<\/p><ul><li><span style=\"font-weight:800\">Comprehensive benefits&nbsp;<\/span>for medical, prescription drug, dental, vision, behavioral health and telemedicine services<\/li><li><span style=\"font-weight:800\">Wellbeing support,&nbsp;<\/span>including free counseling and referral services<\/li><li><span style=\"font-weight:800\">Time away from work&nbsp;<\/span>programs for paid time off, paid family leave, long- and short-term disability coverage and leaves of absence<\/li><li><span style=\"font-weight:800\">Savings and retirement resources<\/span>, including a 401(k) Plan with a 100% match on 3% to 9% of pay (based on years of service), Employee Stock Purchase Plan, flexible spending accounts, preferred banking partnerships, retirement readiness tools, rollover support and financial wellbeing counseling<\/li><li><span style=\"font-weight:800\">Education support&nbsp;<\/span>through tuition assistance, student loan assistance, certification support, dependent scholarships and a partnership with Galen College of Nursing<\/li><li><span style=\"font-weight:800\">Additional benefits&nbsp;<\/span>for fertility and family building, adoption assistance, life insurance, supplemental health protection plans, auto and home insurance, legal counseling, identity theft protection and consumer discounts<\/li><\/ul><p><a href=\"https://careers.hcahealthcare.com/pages/employee-benefits-and-rewards\" class=\"neu-link has-tooltip\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:rgb( 0 , 74 , 153 )\">Learn more about Employee Benefits<\/a><\/p><p><span style=\"font-weight:800\"><i>Note: Eligibility for benefits may vary by location.<\/i><\/span><\/p><blockquote class=\"neu-text--h4 neu-text--heavy neu-text--hca-orange neu-text--align-center neu-padding--20\">\"There is so much good to do in the world and so many different ways to do it.\"<span class=\"neu-padding--10 neu-text--caption neu-text--regular neu-text--slate\">- Dr. Thomas Frist, Sr.<br> HCA Healthcare Co-Founder<\/span><\/blockquote> <p><\/p><p>HCA HealthONE, one of the largest and most comprehensive healthcare systems in the Rocky Mountain region, offers more than 170 care sites in the Denver-metro area. Offering services across the continuum of care to meet patients’ total healthcare needs, HCA HealthONE includes seven acute care hospitals, a dedicated flagship pediatric hospital, a rehabilitation hospital, CareNow® urgent care clinics, mental health campuses, imaging and surgery centers, physician practices, home and hospice care, and AirLife Denver, which provides regional critical care air and ground transportation. Among HCA HealthONE’s acute care hospitals is Mountain Ridge (formerly North Suburban Medical Center), a 157-bed, Level II state-designated trauma facility. Mountain Ridge strives to meet and exceed the needs of the north metro Denver communities by also providing two freestanding, full-service emergency rooms and an outpatient surgery center. Consistently among the Denver Business Journals’ list of top corporate philanthropists in the Denver-metro area, HCA HealthONE was named as one of the most community-minded organizations by The Civic 50 and contributed more than 1 million through cash and in-kind donations last year alone, along with more than 400M in federal, state and local taxes.<\/p> <p>HCA Healthcare has been recognized as one of the World’s Most Ethical Companies® by the Ethisphere Institute more than ten times. In recent years, HCA Healthcare spent an estimated 3.7 billion in costs for the delivery of charitable care, uninsured discounts, and other uncompensated expenses. <\/p>\n<p>Be a part of an organization that leverages our size to make a real impact in our industry! Our Talent Acquisition team is reviewing applications for our RN Clinical Nurse Coordinator opening. <b><i>Submit your application today and help advance the practice of nursing.<\/i><\/b><\/p><p><cite>We are an equal opportunity employer. We do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status.<\/cite><\/p>",

bership.<\/li><li>Voluntary benefits such as accident insurance, critical illness insurance, group legal plan, identity theft protection, pet insurance, auto and home insurance, and employee discount programs.<\/li><li>Time away from work: Paid time off (PTO), paid family and medical leave (inclusive of Colorado FAMLI), leaves of absence.<\/li><li>Employer-provided basic life and accidental death and dismemberment coverage with buy-up coverage options.<\/li><li>Employer-provided short-term disability and long-term disability with a buy-up coverage option.<\/li><\/ul><p><span style=\"font-weight:800\">Retirement and savings<\/span><\/p><p><\/p><p><\/p><ul><li>403(b) plan with employer matching contribution.<\/li><li>Additional 457(b) plan may be available.<\/li><li>Flexible spending accounts for health care and dependent day care; health savings account available when enrolled in high-deductible (HD) medical plan.<\/li><\/ul><p><span style=\"font-weight:800\">Education and career growth<\/span><\/p><p><\/p><ul><li>UCHealth provides access to academic degrees and certificate programs to promote professional and personal growth.<\/li><ul><li>Up to 100% of tuition, books and fees paid for by UCHealth for specific educational degrees.&nbsp;<\/li><li>Other programs may qualify for up to \$10,000/year pre-paid by UCHealth or up to \$5,250/year in the form of tuition reimbursement.&nbsp;<\/li><\/ul><li>Access to LinkedIn Learning, which offers thousands of virtual courses and seminars, and internal professional development opportunities.&nbsp;<\/li><li>Employees have access to free assistance navigating the Public Service Loan Forgiveness program and submitting their federal student loans for forgiveness.<\/li><\/ul><p>*<i>Eligibility for some programs is based on an employee's scheduled work hours.&nbsp;<\/i><\/p><p>We improve lives. In big ways through learning, healing, and discovery. In small, personal ways through human connection. But in all ways, we improve lives.&nb

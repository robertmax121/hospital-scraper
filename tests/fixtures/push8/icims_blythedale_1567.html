<script type="application/ld+json">{"validThrough":"2027-09-08T04:00:00.000Z","employmentType":"FULL_TIME","@type":"JobPosting","baseSalary":{"minValue":24.25,"maxValue":24.55,"@type":"MonetaryAmount","currency":"USD"},"salaryCurrency":"USD","description":"<h2>Pay Range<\/h2>USD $24.25 - USD $24.55 /Hr.\n<h2>About Us<\/h2>\n<p>Blythedale Children's Hospital is a leading pediatric hospital dedicated to providing comprehensive, compassionate care. As the only free-standing children's specialty hospital in New York State, we admit patients with complex medical conditions to our state-of-the-art 94-bed inpatient facility from academic medical centers across New York, New Jersey, Pennsylvania, and Connecticut. Located just 25 miles north of Manhattan in beautiful Westchester County, we offer an inspiring work environment where healthcare professionals thrive.&nbsp; Learn more about Blythedale on our website here.<\/p>\n<h2>Overview<\/h2>\n<p>Under the direction of the nursing leader, the Certified Nurse's Aide assists in performing a variety of duties related to the physical care of the patients, including obtaining report of patient assignments from the RN at the start of the shift and providing meticulous care to each child.&nbsp; Certified nurse's aides are eligible for <strong>evening shift, night shift <\/strong>and <strong>New York State<\/strong> <strong>CNA certification differential.&nbsp;<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>New York State Certified Nurse's Aide Certification differential is $3,000.00 per year.<\/p>\n<h2>Responsibilities<\/h2>\n<ul>\n <li>Maintaining unit and patients\u2019 rooms compliant with regulatory agency codes and standards, obtaining, recording, and reporting vital signs to RN.<\/li>\n <li>Changing patients to and from various adaptive equipment as recommended/directed by the therapists or RN, Maintain accurate patient records and documentation.<\/li>\n <li>Assisting with or performing treatment procedures that have been predetermined for each patient, feeding or assisting with feeding of patients during meals/snacks,<\/li>\n <li>Assisting patients with diapering/toileting/showers as necessary, repositioning assigned patients to promote skin integrity, muscle tone, and maintain body alignment, maintaining excellent hand hygiene, adhering to precautions as required for each patient<\/li>\n <li>Maintaining professional boundaries and assisting the nurse during emergency situations.<\/li>\n<\/ul>\n<h2>Qualifications<\/h2>\n<p>&nbsp;<\/p>\n<ul>\n <li>Needs to be able to perform the following physical activities for most of the time at work: standing, walking, and sitting.<\/li>\n <li>Weekend &amp; Holiday commitment required.<\/li>\n<\/ul>\n<h2>Education, Licensure, and Certification<\/h2>\n<ul>\n <li>High School Diploma or GED.<\/li>\n <li>CNA Positions require New York State Certification<\/li>\n<\/ul>\n<h2>Physical Requirements<\/h2>\n<ul>\n <li>Capability to work long shifts, including nights and weekends, while maintaining a high level of care.<\/li>\n <li>Ability to lift, transfer, and reposition patients safely, often with the aid of equipment like lifts or slings.<\/li>\n <li>Ability to handle and operate medical equipment, as well as perform tasks such as taking vital signs or administering medications.<\/li>\n <li>Must be able to move/lift equipment and patients a minimum of 35-40 lbs.<\/li>\n <li>Must exhibit fine motor coordination in the manipulation of biomedical equipment (e.g., thermometers, scissors, etc.)<\/li>\n<\/ul>\n<h2>Perks of Working at Blythedale<\/h2>\n<ul>\n <li><strong>Competitive Salary:<\/strong> We offer a salary that reflects your skills and experience.<\/li>\n <li><strong>Scholarships:<\/strong> Support for furthering your education and career development.<\/li>\n <li><strong>Professional Development Opportunities:<\/strong> Access to mentorship, leadership training, and career advancement programs.<\/li>\n <li><strong>Comprehensive Health Benefits:<\/strong> Including medical, dental, and vision benefits for your and your family.&nbsp;<\/li>\n <li><strong>Retirement Plans with Employer Matching:<\/strong> Secure your future with our strong retirement plans.<\/li>\n <li><strong>Paid Time Off (PTO):<\/strong> Generous vacation, holiday, and sick leave policies.<\/li>\n <li><strong>Safe Work Environment:<\/strong> Commitment to nurse safety and well-being.<\/li>\n <li><strong>Diversity and Inclusion Initiatives:<\/strong> A workplace that values and supports all employees.<\/li>\n<\/ul>\n<p><strong>Blythedale Children's Hospital is an Equal Opportunity Employer (EOE).<\/strong><\/p>","directApply":true,"title":"Certified Nurse\u2019s Aide, Full-Time, Day Shift, Long-Term Care","@context":"http://schema.org","url":"https://careers-blythedale.icims.com/jobs/1567/certified-nurse%e2%80%99s-aide%2c-full-time%2c-day-shift%2c-long-term-care/job","hiringOrganization":{"@type":"Organization","name":"Blythedale Children's Hospital","sameAs":"https://www.blythedale.org/"},"jobLocation":[{"address":{"addressCountry":"US","streetAddress":"95 Bradhurst Avenue","@type":"PostalAddress","postalCode":"10595","addressLocality":"Valhalla","addressRegion":"NY","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"datePosted":"2026-09-08T04:00:00.000Z","occupationalCategory":"Nurse's Aide and Certified Nurse's Aide"}</script>
